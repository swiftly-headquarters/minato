name: Build

on: [push, workflow_dispatch, pull_request]

permissions:
  contents: write

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.version_step.outputs.semVer }}
      preReleaseLabel: ${{ steps.version_step.outputs.preReleaseLabel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v3.2.1
        with:
          versionSpec: "5.12.x"
      - name: Determine Version
        id: version_step
        uses: gittools/actions/gitversion/execute@v3.2.1

  build:
    needs: versioning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test -race ./...

      - name: Check the committed OpenAPI spec is current
        run: |
          go run ./example/rest openapi example/rest/openapi.json
          go run ./example/rest openapi example/rest/openapi.yaml
          if [ -n "$(git status --porcelain -- example/rest/openapi.json example/rest/openapi.yaml)" ]; then
            git --no-pager diff -- example/rest/openapi.json example/rest/openapi.yaml
            echo "::error::example/rest/openapi.json or .yaml is out of date. Run 'go run ./example/rest openapi example/rest/openapi.json' and the same for .yaml, then commit."
            exit 1
          fi

      - name: Generate a Go SDK from the spec with takumi and compile it
        run: |
          go install github.com/swiftly-headquarters/takumi@v0.1.1
          takumi -input example/rest/openapi.json -output "$RUNNER_TEMP/sdk" -lang go
          cd "$RUNNER_TEMP/sdk"
          go mod init sdkcheck
          go vet ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate a TypeScript SDK, compile it in strict mode and call the example with it
        run: |
          ts="$RUNNER_TEMP/ts"
          mkdir -p "$ts"
          takumi -input example/rest/openapi.json -output "$ts/sdk" -lang typescript
          cp tests/sdk/typescript/run.mjs tests/sdk/typescript/tsconfig.json tests/sdk/typescript/package.json "$ts/"
          (cd "$ts" && npm install --no-audit --no-fund typescript@5 && npx tsc -p tsconfig.json)
          go build -o "$RUNNER_TEMP/example-ts" ./example/rest
          ADDR=127.0.0.1:8081 "$RUNNER_TEMP/example-ts" &
          pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/8081) 2>/dev/null && break
            sleep 0.2
          done
          (cd "$ts" && node run.mjs http://127.0.0.1:8081)

  releasing:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: [versioning, build]
    runs-on: ubuntu-latest
    env:
      TAG_NAME: v${{ needs.versioning.outputs.semVer }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            exit 0
          fi
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.versioning.outputs.preReleaseLabel != '' }}
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
