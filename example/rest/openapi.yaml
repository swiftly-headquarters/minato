openapi: "3.1.0"
info:
  title: "Minato Example"
  version: "1.0.0"
servers:
  - url: "http://localhost:8080"
paths:
  "/admin/stats":
    get:
      operationId: "get-admin-stats"
      summary: "Count users"
      tags:
        - "admin"
      security:
        - bearer: []
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  users:
                    type: "integer"
                    format: "int64"
                required:
                  - "users"
            "application/x-protobuf":
              schema:
                type: "object"
                properties:
                  users:
                    type: "integer"
                    format: "int64"
                required:
                  - "users"
        "401":
          description: "Unauthorized"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
        default:
          description: "Error"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
  "/clock":
    get:
      operationId: "get-clock"
      summary: "Stream the time as server-sent events"
      responses:
        "200":
          description: "OK"
          content:
            "text/event-stream":
              schema:
                type: "string"
        default:
          description: "Error"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
  "/files/{path}":
    get:
      operationId: "get-files-by-path"
      summary: "Echo the requested path (catch-all demo)"
      parameters:
        - name: "path"
          in: "path"
          required: true
          description: "Everything after /files/"
          schema:
            type: "string"
            description: "Everything after /files/"
      responses:
        "200":
          description: "OK"
          headers:
            Content-Type:
              schema:
                type: "string"
          content:
            "application/octet-stream":
              schema:
                type: "string"
                format: "binary"
        "422":
          description: "Unprocessable Entity"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
        default:
          description: "Error"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
  "/hello":
    get:
      operationId: "get-hello"
      summary: "Greet the caller"
      parameters:
        - name: "name"
          in: "query"
          description: "Who to greet"
          schema:
            type: "string"
            description: "Who to greet"
            default: "world"
            maxLength: 32
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    examples:
                      - "Hello, world!"
                required:
                  - "message"
            "application/x-protobuf":
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    examples:
                      - "Hello, world!"
                required:
                  - "message"
        "422":
          description: "Unprocessable Entity"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
        default:
          description: "Error"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
  "/upload":
    post:
      operationId: "post-upload"
      summary: "Upload a file with a title"
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              type: "object"
              properties:
                file:
                  type: "string"
                  format: "binary"
                title:
                  type: "string"
                  description: "Name for the file"
                  minLength: 1
              required:
                - "file"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  bytes:
                    type: "integer"
                    format: "int64"
                  name:
                    type: "string"
                  title:
                    type: "string"
                required:
                  - "title"
                  - "name"
                  - "bytes"
            "application/x-protobuf":
              schema:
                type: "object"
                properties:
                  bytes:
                    type: "integer"
                    format: "int64"
                  name:
                    type: "string"
                  title:
                    type: "string"
                required:
                  - "title"
                  - "name"
                  - "bytes"
        "413":
          description: "Request Entity Too Large"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
        "415":
          description: "Unsupported Media Type"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
        "422":
          description: "Unprocessable Entity"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
        default:
          description: "Error"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
  "/users":
    get:
      operationId: "get-users"
      summary: "List users"
      tags:
        - "users"
      parameters:
        - name: "limit"
          in: "query"
          description: "Maximum number of items to return"
          schema:
            type: "integer"
            format: "int64"
            description: "Maximum number of items to return"
            default: 20
            minimum: 1
            maximum: 100
        - name: "cursor"
          in: "query"
          description: "Opaque cursor from the previous page's next_cursor; omit for the first page"
          schema:
            type: "string"
            description: "Opaque cursor from the previous page's next_cursor; omit for the first page"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PageBodyUser"
            "application/x-protobuf":
              schema:
                "$ref": "#/components/schemas/PageBodyUser"
        "422":
          description: "Unprocessable Entity"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
        default:
          description: "Error"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
    post:
      operationId: "post-users"
      summary: "Create a user"
      description: "The role defaults to \"member\"."
      tags:
        - "users"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/UserInput"
          "application/x-protobuf":
            schema:
              "$ref": "#/components/schemas/UserInput"
      responses:
        "201":
          description: "Created"
          headers:
            Location:
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/User"
            "application/x-protobuf":
              schema:
                "$ref": "#/components/schemas/User"
        "422":
          description: "Unprocessable Entity"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
        default:
          description: "Error"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
  "/users/{id}":
    delete:
      operationId: "delete-users-by-id"
      summary: "Remove a user"
      tags:
        - "users"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
      responses:
        "204":
          description: "No Content"
        "404":
          description: "Not Found"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
        "422":
          description: "Unprocessable Entity"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
        default:
          description: "Error"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
    get:
      operationId: "get-users-by-id"
      summary: "Fetch a user by ID"
      tags:
        - "users"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/User"
            "application/x-protobuf":
              schema:
                "$ref": "#/components/schemas/User"
        "404":
          description: "Not Found"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
        "422":
          description: "Unprocessable Entity"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
        default:
          description: "Error"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
    patch:
      operationId: "patch-users-by-id"
      summary: "Change some fields of a user"
      tags:
        - "users"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PatchBody"
          "application/x-protobuf":
            schema:
              "$ref": "#/components/schemas/PatchBody"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/User"
            "application/x-protobuf":
              schema:
                "$ref": "#/components/schemas/User"
        "404":
          description: "Not Found"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
        "422":
          description: "Unprocessable Entity"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
        default:
          description: "Error"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ErrorModel"
components:
  schemas:
    ErrorDetail:
      type: "object"
      properties:
        location:
          type: "string"
        message:
          type: "string"
        value: {}
      required:
        - "message"
    ErrorModel:
      type: "object"
      properties:
        detail:
          type: "string"
          description: "Explanation specific to this occurrence"
        errors:
          type: "array"
          description: "Individual validation problems"
          items:
            "$ref": "#/components/schemas/ErrorDetail"
        fields:
          type: "object"
          description: "The same problems nested by field name, with the messages of each field under _errors"
          additionalProperties: {}
        status:
          type: "integer"
          format: "int64"
          description: "HTTP status code"
        title:
          type: "string"
          description: "Short summary of the problem type"
        type:
          type: "string"
          description: "URI identifying the problem type"
    PageBodyUser:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/User"
        next_cursor:
          type: "string"
          description: "Pass as cursor to get the next page; absent on the last page"
      required:
        - "items"
    PatchBody:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 64
        role:
          type: "string"
          enum:
            - "admin"
            - "member"
    User:
      type: "object"
      properties:
        email:
          type: "string"
          format: "email"
          examples:
            - "ada@example.com"
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
          description: "Display name"
          examples:
            - "Ada"
          minLength: 1
          maxLength: 64
        role:
          type: "string"
          enum:
            - "admin"
            - "member"
          default: "member"
      required:
        - "id"
        - "name"
        - "email"
    UserInput:
      type: "object"
      properties:
        email:
          type: "string"
          format: "email"
          examples:
            - "ada@example.com"
        name:
          type: "string"
          description: "Display name"
          examples:
            - "Ada"
          minLength: 1
          maxLength: 64
        role:
          type: "string"
          enum:
            - "admin"
            - "member"
          default: "member"
      required:
        - "name"
        - "email"
  securitySchemes:
    bearer:
      scheme: "bearer"
      type: "http"
